name: Post to Telegram
on:
  schedule:
    - cron: "7 4-15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post-agent
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow imageio-ffmpeg
      - run: python rss_ig_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_EVERY: "3"
          TIMEZONE: Asia/Tashkent
      - name: Save history
        run: |
          git config user.name "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git add posted_history.json || true
          git diff --staged --quiet || (git commit -m "update history" && git push)
