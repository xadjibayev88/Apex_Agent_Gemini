name: Post to Telegram
on:
  schedule:
    # GitHub ko'p qiymatli "7,37 4-15" jadvalni kuniga ~2 marta ishga tushirardi.
    # Har soat alohida qator (Toshkent 09:xx-20:xx), daqiqalar :00 dan uzoq.
    - cron: "11 4 * * *"
    - cron: "41 5 * * *"
    - cron: "13 6 * * *"
    - cron: "43 7 * * *"
    - cron: "17 8 * * *"
    - cron: "47 9 * * *"
    - cron: "19 10 * * *"
    - cron: "49 11 * * *"
    - cron: "23 12 * * *"
    - cron: "53 13 * * *"
    - cron: "29 14 * * *"
    - cron: "59 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post-agent
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow imageio-ffmpeg
      - run: python rss_ig_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MIN_GAP_MINUTES: "55"
          IG_GAP_HOURS: "3"
          TIMEZONE: Asia/Tashkent
      - name: Save history
        run: |
          git config user.name "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git add posted_history.json || true
          git add last_reel_style.json || true
          git diff --staged --quiet || (git commit -m "update history" && git push)
